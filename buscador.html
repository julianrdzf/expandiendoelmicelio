<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Hongos - Expandiendo el Micelio</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        .search-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
        }

        .search-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .search-input {
            flex: 1;
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.1rem;
        }

        .search-button {
            padding: 1rem 2rem;
            background-color: #4a6741;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background-color 0.3s;
        }

        .search-button:hover {
            background-color: #3a5233;
        }

        .mushroom-selector {
            width: 300px;
            height: 400px;
            margin: 2rem auto;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mushroom-part {
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .mushroom-part:hover {
            transform: scale(1.05);
        }

        /* Sombrero del hongo */
        .cap {
            width: 200px;
            height: 100px;
            background-color: #FFFFFF;
            border: 2px solid #333;
            border-radius: 100px 100px 0 0;
            position: relative;
            z-index: 3;
        }

        /* Láminas */
        .gills {
            width: 180px;
            height: 30px;
            background-color: #FFFFFF;
            border: 2px solid #333;
            border-radius: 0 0 90px 90px;
            margin-top: -2px;
            position: relative;
            z-index: 2;
        }

        /* Pie */
        .stem {
            width: 60px;
            height: 160px;
            background-color: #FFFFFF;
            border: 2px solid #333;
            border-radius: 30px;
            margin-top: -2px;
            position: relative;
            z-index: 1;
        }

        .color-picker {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            top: 0;
            left: 0;
            margin: 0;
            padding: 0;
        }

        .selector-labels {
            text-align: center;
            margin-top: 2rem;
            font-weight: bold;
            color: #4a6741;
        }

        .color-search-button {
            margin-top: 2rem;
            padding: 0.8rem 2rem;
            background-color: #4a6741;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: auto;
            margin-right: auto;
        }

        .color-search-button:hover {
            background-color: #3a5233;
            transform: translateY(-2px);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            padding: 1rem;
            margin-top: 3rem;
        }

        .fungi-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .fungi-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .fungi-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .fungi-info {
            padding: 1rem;
        }

        .fungi-info h3 {
            margin: 0 0 0.5rem 0;
            color: #4a6741;
        }

        .fungi-info p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="hero">
        <header>
            <img src="images/logo.png" alt="expandiendo el micelio" class="logo">
            <nav>
                <button class="menu-toggle">☰</button>
                <ul class="nav-menu">
                    <li><a href="index.html">Inicio</a></li>
                </ul>
            </nav>
        </header>
    </div>

    <main>
        <section class="section">
            <h2>Buscador de Hongos</h2>
            
            <div class="search-container">
                <div class="search-box">
                    <input type="text" class="search-input" placeholder="Buscar por nombre común o científico...">
                    <button class="search-button">
                        <i class="fas fa-search"></i> Buscar
                    </button>
                </div>
                <div class="selector-labels">
                        Selecciona el color de cada parte del hongo
                </div>

                <div class="mushroom-selector">
                    
                    <div class="mushroom-part cap">
                        <input type="color" id="superficie" class="color-picker" value="#FFFFFF" title="Color del sombrero">
                    </div>
                    <div class="mushroom-part gills">
                        <input type="color" id="parte-inferior" class="color-picker" value="#FFFFFF" title="Color de las láminas">
                    </div>
                    <div class="mushroom-part stem">
                        <input type="color" id="pie" class="color-picker" value="#FFFFFF" title="Color del pie">
                    </div>
                    <button class="color-search-button">
                        <i class="fas fa-palette"></i>
                        Buscar por colores
                    </button>
                </div>

                <div class="results-grid">
                    <!-- Los resultados se agregarán dinámicamente con JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Expandiendo el Micelio. Todos los derechos reservados.</p>
    </footer>

    <button id="backToTop" class="back-to-top">&gt;</button>

    <script>
        // Menú móvil
        document.querySelector(".menu-toggle").addEventListener("click", function() {
            document.querySelector(".nav-menu").classList.toggle("show");
        });

        // Botón volver arriba
        document.addEventListener("DOMContentLoaded", function () {
            const backToTopButton = document.getElementById("backToTop");

            window.addEventListener("scroll", function () {
                if (window.scrollY > 200) {
                    backToTopButton.style.display = "flex";
                } else {
                    backToTopButton.style.display = "none";
                }
            });

            backToTopButton.addEventListener("click", function () {
                window.scrollTo({ top: 0, behavior: "smooth" });
            });

            // Actualizar colores del hongo
            const colorInputs = ['superficie', 'parte-inferior', 'pie'];
            const parts = ['cap', 'gills', 'stem'];
            
            colorInputs.forEach((id, index) => {
                const input = document.getElementById(id);
                input.addEventListener('input', function() {
                    const part = document.querySelector('.' + parts[index]);
                    part.style.backgroundColor = this.value;
                });
            });

            // Manejar búsqueda por colores
            document.querySelector('.color-search-button').addEventListener('click', function() {
                const colors = {
                    sombrero: document.getElementById('superficie').value,
                    laminas: document.getElementById('parte-inferior').value,
                    pie: document.getElementById('pie').value
                };
                // La funcionalidad de búsqueda se implementará más adelante
            });
        });
    </script>
</body>
</html>
